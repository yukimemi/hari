[package]
name = "hari"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Let jj run your existing Git pre-push hooks"
authors = ["yukimemi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yukimemi/hari"
homepage = "https://github.com/yukimemi/hari"
keywords = ["git", "jj", "jujutsu", "hooks", "pre-push"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "tests/**/*.rs", "examples/*.rs", "assets/*.svg", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[features]
default = ["self-update"]
self-update = ["dep:kaishin", "dep:tokio"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
dunce = "1.0.5"
kaishin = { version = "0.7.5", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt", "time", "net"], optional = true }
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
